# =========================================================
# SERVICE - NODEPORT
# =========================================================
apiVersion: v1
kind: Service
metadata:
  name: vt-web
  namespace: awm
spec:
  type: NodePort
  selector:
    app: vt-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
