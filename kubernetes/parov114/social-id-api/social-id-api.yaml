# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: social-id-api-config
  namespace: awm
data:
  TZ: "America/Argentina/Buenos_Aires"
  awm.properties.file.path: "/home/awm/awm-system/conf/conf.properties"
  audit.enabled: "false"
  audit.activemq.broker-url: "tcp://activemq.activemq-clasic.svc.cluster.local:61616"
  audit.activemq.user: "admin"
  audit.activemq.password: "N3c4r123!"
  biometric.transaction.expect-sync-response: "false"
  logging.level.ar.com.nec.socialid.api: "error"
  jre.enable-rest: "true"
  jre.service.base-url: "http://awm:8080"
  pget.enable-rest: "true"
  pget.service.base-url: "http://awm:8080"
  pgeth.enable-rest: "true"
  pgeth.service.base-url: "http://awm:8080"
  bms.processing.useInterestListAsBinsGalley: "true"
  bms.processing.bins.face: "DEFAULT_7_FACE_CIVIL"
  bms.processing.bins.finger: "DEFAULT_3_FINGER_CARD_ROLL_CIVIL"
  pver.enable-rest: "true"
  pver.service.base-url: "https://paro-manager-v114.paro.svc.cluster.local:8080/paro/v1"
  #pver.service.base-url: "https://paro-manager.parov114.svc.cluster.local:8080/paro/v1"
  verdict.autohit.finger-score: "1000"
  verdict.autohit.finger-match-percentage: "20"
  verdict.autohit.face-score: "7000"
  search.cross-finger-enabled: "false"
  registered-fingers.service.base-url: "http://awm:8080"


---
# Secret (Truststore TLS)
apiVersion: v1
kind: Secret
metadata:
  name: paro-truststore
  namespace: awm
type: Opaque
data:
  truststore.jks: 

---
# StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: social-id-api
  namespace: awm
spec:
  serviceName: social-id-api
  replicas: 1
  selector:
    matchLabels:
      app: social-id-api
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0      
  template:
    metadata:
      labels:
        app: social-id-api
    spec:
      imagePullSecrets:
        - name: regcred-neclatam

      containers:
      - name: social-id-api
        image: docker.neclatam-cloud.com/social-id/social-id-api:7.2.9-DATAPREV
        imagePullPolicy: IfNotPresent
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP

        envFrom:
        - configMapRef:
            name: social-id-api-config

        env:
        - name: JAVA_TOOL_OPTIONS
          value: >
            -Djavax.net.ssl.trustStore=/etc/ssl/truststore/truststore.jks
            -Djavax.net.ssl.trustStorePassword=changeit

        volumeMounts:
        - name: awm-system
          mountPath: /home/awm/awm-system

        - name: next-id-sequences
          mountPath: /next-id-sequences

        - name: truststore-volume
          mountPath: /etc/ssl/truststore
          readOnly: true

        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "1"
            memory: 4Gi
         
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30

        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

      volumes:
      - name: truststore-volume
        secret:
          secretName: paro-truststore



  volumeClaimTemplates:
  - metadata:
      name: awm-system
      namespace: awm
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 50Gi
      storageClassName: oci-bv

  - metadata:
      name: next-id-sequences
      namespace: awm
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 5Gi
      storageClassName: oci-bv

