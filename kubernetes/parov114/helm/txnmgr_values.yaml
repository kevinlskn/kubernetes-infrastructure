image:
  # -- Transaction manager container image registry.
  registry: docker.neclatam-cloud.com
  txnmgr:
    # -- Transaction manager repository.
    repository: bms/v1.14_ga/txnmgr/txnmgr
    # -- Transaction manager tag.
    tag: 1.14.0.release-1.14.0.1c095b5.1912fb50
    # -- Transaction manager pull policy.
    pullPolicy: Always
  txnmgrLiquibase:
    # -- Transaction manager repository.
    repository: bms/v1.14_ga/txnmgr/txnmgr-liquibase
    # -- Transaction manager tag.
    tag: 1.14.0.release-1.14.0.1c095b5.1912fb50
    # -- Transaction manager pull policy.
    pullPolicy: Always

imagePullSecret:
  # -- Image pull secret name for pulling transaction manager container images.
  name: txnmgr-regcred
  registryCredential:
    # -- Private container registry username for pulling transaction manager container images.
    username: delivery-latam
    # -- Private container registry password for pulling transaction manager container images.
    password: bsBh6zeM-BrPd9hCBbvD_LRW

# -- Java options passed to Transaction manager.
javaOpts: "-Xms4g -Xmx4g -XX:-OmitStackTraceInFastThrow"

otelagent:
  # -- Enable OpenTelemetry or not.
  enabled: false
  # -- JVM options for OpenTelemetry.
  options: ""

txnmgrsslsecret: txnmgr-ssl-secret

txnmgr:
  # -- Node label for Transaction manager pod assignment.
  nodeSelector:
    kubernetes.io/os: linux
  # -- Tolerations for Transaction manager pod assignment.
  tolerations: []
  # -- Enable https for txnmgr
  security:
    requireSsl: true
  # -- Number of pods in transaction manager.
  replicas: 1
  # -- Kubernetes service DNS of NDP Cache Server (Hazelcast cluster).
  # Ref: https://docs.hazelcast.com/hazelcast/latest/deploy/configuring-kubernetes#using-kubernetes-in-dns-lookup-mode
  ndpCacheServerServiceDns: ndp-cache-server.ndp-cache-serverv114.svc.cluster.local
  # -- Default paro manager url.
  defaultParoUrl: https://paro-manager.parov114.svc.clusterv.local:8080/paro/v1
  # -- Transaction manager container resource requests and limits.
  resources:
    requests:
      cpu: 4000m
      memory: 5000Mi
  # -- Transaction manager container startup probe.
  startupProbe:
    exec:
      command:
        - /bin/sh
        - -c
        - ps -ef | grep java | grep -v grep
    failureThreshold: 6
    initialDelaySeconds: 15
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  # -- Transaction manager container liveness probe.
  livenessProbe:
    httpGet:
      scheme: HTTPS
      port: 8080
      path: /tm/v1/info
    failureThreshold: 3
    initialDelaySeconds: 15
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 3
  # -- Transaction manager container readiness probe.
  readinessProbe:
    httpGet:
      scheme: HTTPS
      port: 8080
      path: /tm/v1/info
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3
  springdoc:
    # -- Comma-separated list of paths to exclude from OpenAPI documentation.
    pathsToExclude: none
  # -- The interval in seconds to update the internal cache.
  cacheReloadIntervalSecs: 60
  # -- Maximum JSON string size in MB allowed for request parsing.
  maxStringSizeMB: 80
  # -- Environment variables to be added to transaction manager.
  # Only add environment variables that are not supported by this chart.
  extraEnvs: [ ]
  # extraEnvs:
  #  - name: FOO
  #    value: "BAR"
  # -- Job Processor configuration.
  jp:
    # -- Maximum number of jobs that can be acquired from the queue at once.
    queueAcquireLimit: 50
    # -- Maximum number of work-in-progress (WIP) jobs that can be acquired at once.
    wipAcquireLimit: 50
    # -- Timeout in milliseconds for acquiring jobs from the queue and wip.
    acquireTimeoutMilli: 90000
    # -- Timeout in milliseconds for searching jobs.
    searchTimeoutMilli: 60000
    # -- Timeout in milliseconds for extraction jobs.
    extractTimeoutMilli: 60000
    # -- Timeout in milliseconds for verification jobs.
    verifyTimeoutMilli: 60000
    # -- Timeout in milliseconds for convert jobs.
    convertTimeoutMilli: 60000
    # -- Timeout in milliseconds for liveness jobs.
    checkLivenessTimeoutMilli: 60000
    # -- Timeout in milliseconds for IAD extract jobs.
    iadExtractTimeoutMilli: 60000
    # -- The period in minutes after which jobs are considered old and can be purged.
    jobRetentionPeriodMinutes: 30
    # -- The maximum number of jobs that can be extracted concurrently.
    extractJobConcurrency: 10
    # -- The maximum number of jobs that can be verified concurrently.
    verifyJobConcurrency: 10
    # -- The maximum number of convert jobs that can be done concurrently.
    convertJobConcurrency: 10
    # -- The maximum number of jobs that can be searched in dataset concurrently.
    datasetJobConcurrency: 10
    # -- The maximum number of check liveness jobs.
    checkLivenessJobConcurrency: 10
    # -- The maximum number of iad extract jobs.
    iadExtractJobConcurrency: 10
    # -- The interval in milliseconds at which the job queue is polled for new jobs.
    jobQueuePollIntervalMilli: 5000
    # -- The interval in milliseconds at which the work-in-progress (WIP) jobs are polled.
    jobWipPollIntervalMilli: 5000
    # -- The interval in milliseconds at which the job timeout is checked.
    jobTimeoutPollIntervalMilli: 5000
    # The type of blob storage to use. Valid values are "Azure", "Db".
    blobStorageType: "Db"
    # The maximum number of jobs queue records that can be processed concurrently.
    jobQueueProcessConcurrency: 10
    # The maximum number of jobs WIP records that can be processed concurrently.
    jobWipProcessConcurrency: 10
    # The maximum number of job callback from paro that can be processed concurrently.
    jobCallbackProcessConcurrency: 20
    # The capacity of the job queue dispatch channel.
    jobQueueDispatchChannelCapacity: 20
    # The capacity of the job WIP dispatch channel.
    jobWipProcessChannelCapacity: 20
    # The capacity of the job callback process channel.
    jobCallbackProcessChannelCapacity: 50
    # Number of days to retain inactive tenants.
    inactiveTenantRetentionDays: 99999
    # -- Prefix tenantId to bin/dataset IDs in search responses (e.g., "tenantId/containerId").
    prefixTenantIdInSearchResponse: false
  # -- Outbound HTTP client (Ktor) timeouts. Bound to prevent worker threads from being
  # blocked by black-holed peers for the OS TCP timeout (~75-130s).
  restClient:
    # -- Maximum time in milliseconds to establish a TCP connection.
    connectTimeoutMilli: 5000
    # -- Maximum time in milliseconds for a complete HTTP request (connect + send + receive).
    requestTimeoutMilli: 30000
    # -- Maximum idle time in milliseconds between TCP packets on an established connection.
    socketTimeoutMilli: 30000
    # -- Maximum time in milliseconds for the TLS handshake to complete.
    # Surfaced as the JVM property `jdk.tls.handshakeTimeout`.
    sslHandshakeTimeoutMilli: 10000
  azure:
    # -- Azure Blob Storage configuration.
    blobStorage:
      endpoint: https://txnmgr.blob.core.windows.net/
      sasToken:
      containerName: jobpayload
  db:
    # -- Database engine profile.
    # (MySQL: `mysql`, Microsoft SQL Server: `mssql`, PostgreSQL: `postgresql`, Oracle: `oracle`)
    profile: "oracle"
    # -- JDBC url to access paro database.
    # Examples:
    #   MySQL: jdbc:mariadb://mysql.example.com:3306/txnmgr?serverTimezone=UTC&sslMode=trust&allowPublicKeyRetrieval=true&socketTimeout=3000
    #   Microsoft SQL Server: jdbc:sqlserver://mssql.example.com:1433;databaseName=txnmgr;encrypt=true;trustServerCertificate=true;socketTimeout=3000
    #   PostgreSQL: jdbc:postgresql://postgresql.example.com:5432/txnmgr?ssl=true&sslmode=require
    #   Oracle: jdbc:oracle:thin:@tcps://<endpoint>:2484/txnmgr?ssl_server_dn_match=false&wallet_location=/etc/wallets
    jdbcUrl: "jdbc:oracle:thin:@//172.31.92.116:1521/dbbms114_PDBBMS114.paas.oracle.com"
    # -- Username to access database.
    username: "TXNMGR"
    # -- Password to access database.
    password: "TxnM4n4g3r%*"
    # -- Maximal connection pool size.
    poolMaxSize: 100
    # -- Initial connection pool size.
    poolInitialSize: 10
    # -- Maximum amount of time that a connection is allowed to sit idle in the pool.
    poolIdleTimeout: "60000"
    # -- Maximum time to wait to create a new connection.
    poolConnectionTimeout: "30000"
    # -- Oracle Wallet auto login file paths. Required if using the Oracle database.
    oracleCWalletPath: ""
    # -- Oracle Wallet PKCS#12 file paths. Required if using the Oracle database.
    oracleEWalletPath: ""
txnmgrLiquibase:
  # -- Transaction manager liquibase container resource requests and limits.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi

logLevel:
  # -- Transaction manager application log level.
  manager: INFO
  # -- Hazelcast log level.
  hazelcast: INFO

service:
  # -- Service type. (ClusterIP, NodePort, and LoadBalancer)
  type: ClusterIP
  # -- The port on each node on which Transaction manager service is exposed when type is NodePort.
  txnmgrNodePort: 32002
  # -- Service annotations.
  annotations: {}
  # -- IP address range for connection source when type is LoadBalancer.
  loadBalancerSourceRanges: []

ingress:
  # -- Create ingress or not.
  enabled: false
  # -- Ingress class name.
  className: ""
  # -- Ingress annotations.
  annotations:
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/client-body-buffer-size: "5m"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    kubernetes.io/ingress.class: "nginx"
  # -- FQDN of a network host.
  host: "tm.example.com"
  # -- Path of an incoming request.
  path: /tm
  # -- Type of the interpretation of the Path matching.
  pathType: Prefix
  tls:
    # -- Name of th secret used to terminate TLS traffic.
    secret: ingress-tls

gateway:
  # -- Create a gateway or not.
  enabled: false
  # -- Gateway class name (mandatory)
  # eg=Envoy Gateway
  className: "eg"
  # -- FQDN of a network host.
  host: "tm.example.com"
  service:
    # -- Gateway service type. (ClusterIP, LoadBalancer)
    type: ClusterIP
    # -- Gateway service annotations.
    annotations: {}
  # -- Path of an incoming request.
  path: /
  # -- Type of the interpretation of the Path matching.
  pathType: PathPrefix
  tls:
    # -- Name of th secret used to terminate TLS traffic on Gateway.
    secret: txnmgr-gateway-tls

