---
# ==========================================================
# Deployment 1
# ==========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bms-adapter-1
  namespace: awm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bms-adapter
      instance: "1"

  template:
    metadata:
      labels:
        app: bms-adapter
        instance: "1"

    spec:
      imagePullSecrets:
      - name: regcred-neclatam

      containers:
      - name: bms-adapter
        image: docker.neclatam-cloud.com/goias/abis-bms-goias-poc:1.0.3-EXECUTORS

        ports:
        - containerPort: 8080

        envFrom:
        - configMapRef:
            name: bms-adapter-config-1

        resources:
          requests:
            cpu: 250m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi

        env:
        - name: JAVA_TOOL_OPTIONS
          value: >
            -Djavax.net.ssl.trustStore=/etc/ssl/custom/truststore.jks
            -Djavax.net.ssl.trustStorePassword=changeit

        volumeMounts:
        - name: truststore-volume
          mountPath: /etc/ssl/custom
          readOnly: true

      volumes:
      - name: truststore-volume
        secret:
          secretName: bms-truststore

