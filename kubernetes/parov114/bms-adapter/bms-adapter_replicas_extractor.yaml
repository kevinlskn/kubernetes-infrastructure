# Secret
apiVersion: v1
kind: Secret
metadata:
  name: bms-truststore
  namespace: awm
type: Opaque
data:
  truststore.jks: 

---
# ==========================================================
# ConfigMap - Instancia 1
# ==========================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: bms-adapter-config-1
  namespace: awm
data:
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
  MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED: "true"
  MANAGEMENT_METRICS_TAGS_APPLICATION: "bms-adapter"

  #abis.bms.baseurl: "https://paro-manager.parov114.svc.cluster.local:8080/paro/v1"
  abis.bms.baseurl: "https://paro-manager-v114.paro.svc.cluster.local:8080/paro/v1"
  abis.bms.tenant-id: "DEFAULT"
  abis.bms.face.bind-id: "DEFAULT_7_FACE_CIVIL"
  abis.bms.tenprint.bind-id: "DEFAULT_3_FINGER_CARD_ROLL_CIVIL"

  abis.bms.callback.face.extract: "http://bms-adapter-1.awm.svc.cluster.local:8080/api/v1.0/callback/face-extract"
  abis.bms.callback.face.search: "http://bms-adapter-1.awm.svc.cluster.local:8080/api/v1.0/callback/face-search"
  abis.bms.callback.face.verify: "http://bms-adapter-1.awm.svc.cluster.local:8080/api/v1.0/callback/face-verification"
  abis.bms.callback.tenprint.extract: "http://bms-adapter-1.awm.svc.cluster.local:8080/api/v1.0/callback/tenprint-extract"
  abis.bms.callback.tenprint.search: "http://bms-adapter-1.awm.svc.cluster.local:8080/api/v1.0/callback/tenprint-search"
  abis.bms.callback.tenprint.verify: "http://bms-adapter-1.awm.svc.cluster.local:8080/api/v1.0/callback/tenprint-verification"

  abis.bms.token.tenant-id: "DEFAULT"
  abis.bms.token.issuer: "Issuer"
  abis.bms.token.username: "JavaInUse"
  abis.bms.token.role: "Admin"
  #abis.bms.token.paro-url: "https://paro-manager.parov114.svc.cluster.local:8080/paro/v1"
  abis.bms.token.paro-url: "https://paro-manager-v114.paro.svc.cluster.local:8080/paro/v1"
  abis.bms.token.bms-url: "http://bms-etl.bms-etl.svc.cluster.local:8080/bmsetl/v1"
  abis.bms.token.realm-roles: "PLATFORM_ADMIN"

  abis.bms.callback-log-request-body: "false"
  spring.cloud.openfeign.client.config.bmsoperationsclient.loggerlevel: "basic"
  logging.level.ar.com.nec.socialid.main: "error"
  biometric.dev.controller.enabled: "false"
  abis.bms.connect-timeout: "5000"
  abis.bms.read-timeout: "30000"
  abis.bms.sync-job-timeout-seconds: "60"
  abis.bms.tenprint.quality-algos: "iql,nfiq2"
  abis.bms.tenprint.extract-synchronous: "true"
  abis.bms.http.max-connections: "100"
  abis.bms.http.max-connections-per-route: "50"


  async.executor.core-pool-size: "20"
  async.executor.max-pool-size: "100"
  async.executor.queue-capacity: "500"

  async.sync-job.core-pool-size: "10"
  async.sync-job.max-pool-size: "30"
  async.sync-job.queue-capacity: "100"

  async.extract.core-pool-size: "20"
  async.extract.max-pool-size: "50"
  async.extract.queue-capacity: "300"

  async.callback.core-pool-size: "20"
  async.callback.max-pool-size: "50"
  async.callback.queue-capacity: "300"

  callback.http-client.connect-timeout-ms: "10000"
  callback.http-client.request-timeout-ms: "30000"

