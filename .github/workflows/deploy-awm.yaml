
name: Deploy parov114 to OKE

'on':
  push:
    branches:
      - main
    paths:
      - "kubernetes/parov114/**"
      - ".github/workflows/deploy-awm.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-parov114
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply all parov114 manifests
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Build all manifests
        run: |
          kubectl kustomize kubernetes/parov114 \
            > /tmp/parov114-rendered.yaml

      - name: Apply all parov114 resources
        run: |
          kubectl apply -k kubernetes/parov114

      - name: Show applied resources
        run: |
          kubectl get -f /tmp/parov114-rendered.yaml
